<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>รายละเอียดนิยาย</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <script src="data.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background: #f9f9f9; padding: 20px; color: #333; }
        .container { max-width: 750px; margin: 40px auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .btn-back { margin-bottom: 25px; cursor: pointer; border: none; background: #f0f0f0; padding: 8px 18px; border-radius: 20px; font-family: 'Sarabun'; transition: 0.2s; }
        .btn-back:hover { background: #e0e0e0; }
        .header { display: flex; gap: 30px; margin-bottom: 40px; }
        .cover-img { width: 180px; height: 260px; object-fit: cover; border-radius: 10px; box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .info h2 { margin: 0 0 10px 0; font-size: 1.6rem; color: #2c3e50; }
        .author { color: #27ae60; font-weight: bold; margin-bottom: 15px; }
        .desc { line-height: 1.7; color: #666; font-size: 0.95rem; }
        .chapter-list { border-top: 2px solid #f5f5f5; padding-top: 25px; }
        .chapter-item { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; border-bottom: 1px solid #f9f9f9; cursor: pointer; transition: 0.2s; border-radius: 8px;
        }
        .chapter-item:hover { background: #f0f9f4; transform: scale(1.01); }
        .chapter-item span { font-weight: 500; }
        .read-icon { color: #27ae60; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <button class="btn-back" onclick="location.href='index.html'">⬅ กลับหน้าหลัก</button>
    <div class="header">
        <img src="" id="main-cover" class="cover-img">
        <div class="info">
            <h2 id="title"></h2>
            <p class="author">ผู้เขียน: HOWZLER</p>
            <p id="description" class="desc"></p>
        </div>
    </div>
    <div class="chapter-list">
        <h3>รายชื่อตอน</h3>
        <div id="chapter-container"></div>
    </div>
</div>
    <script type="module" src="auth.js"></script>
<script>
        const urlParams = new URLSearchParams(window.location.search);
        const bookId = urlParams.get('id') || 'vol1'; // บรรทัดเดียวจบ
        const currentBook = bookData[bookId];

    if (currentBook) {
        document.getElementById("main-cover").src = currentBook.cover;
        document.getElementById("title").textContent = currentBook.title;
        document.getElementById("description").textContent = currentBook.desc;

        const container = document.getElementById("chapter-container");
        currentBook.chapters.forEach((ch) => {
            const div = document.createElement("div");
            div.className = "chapter-item";
            div.onclick = () => location.href = `reader.html?book=${encodeURIComponent(ch.file)}&reset=true`;
            div.innerHTML = `<span>${ch.name}</span> <span class="read-icon">อ่าน ⮕</span>`;
            container.appendChild(div);
        });
    }
</script>
</body>
</html>
