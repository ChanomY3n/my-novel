<!DOCTYPE html>
<html lang="th">
<head>
    <script type="module" src="auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ห้องสมุดนิยายของฉัน</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <script src="data.js"></script>
    <style>
        :root { --bg-color: #f8f9fa; --primary-color: #2c3e50; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg-color); margin: 0; padding: 40px 20px; }
        h1 { text-align: center; color: var(--primary-color); margin-bottom: 40px; font-weight: 700; }
        .bookshelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 35px; max-width: 1100px; margin: 0 auto; }
        .book-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.08); transition: all 0.3s ease; cursor: pointer; display: flex; flex-direction: column; }
        .book-card:hover { transform: translateY(-10px); box-shadow: 0 12px 25px rgba(0,0,0,0.15); }
        .book-cover { width: 100%; height: 280px; object-fit: cover; }
        .book-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .book-title { font-weight: bold; font-size: 1.05rem; margin: 0; color: #333; height: 2.8em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .read-btn { margin-top: 15px; background: #27ae60; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .read-btn:hover { background: #219150; }
    </style>
</head>
<body>
    <h1>รายการหนังสือ</h1>
    <div class="bookshelf" id="bookshelf-container"></div>
    
    <script src="auth.js"></script>
    <script>
                const container = document.getElementById('bookshelf-container');
        for (let id in bookData) {
            const book = bookData[id];
            container.innerHTML += `
                <div class="book-card" onclick="location.href='details.html?id=${id}'">
                    <img src="${book.cover}" class="book-cover">
                    <div class="book-info">
                        <p class="book-title">${book.title}</p>
                        <button class="read-btn">เริ่มอ่าน</button>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
