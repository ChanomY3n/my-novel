<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ</title>
    <style>
        body { font-family: 'Sarabun', sans-serif; background: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 320px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #219150; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔓 เข้าสู่ระบบ</h2>
        <input type="email" id="email" placeholder="อีเมล">
        <input type="password" id="password" placeholder="รหัสผ่าน">
        <button onclick="handleLogin()">ตกลง</button>
    </div>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDfsPbmFn1z4eUsqD0nRzz47X1LFlNPV9E",
        authDomain: "mynovelreader-7fea4.firebaseapp.com",
        projectId: "mynovelreader-7fea4",
        storageBucket: "mynovelreader-7fea4.firebasestorage.app",
        messagingSenderId: "758204370201",
        appId: "1:758204370201:web:962a4bbdb0d5acfcb98988",
        measurementId: "G-EXP3JN1NBP"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // เชื่อมต่อปุ่มตกลงกับระบบ Firebase
    window.handleLogin = function() {
        const email = document.getElementById("email").value;
        const pass = document.getElementById("password").value;

        signInWithEmailAndPassword(auth, email, pass)
            .then((userCredential) => {
                // เมื่อ Login สำเร็จ จะเด้งไปหน้าหลัก
                window.location.href = "index.html";
            })
            .catch((error) => {
                // แสดงข้อความเตือนถ้าเข้าไม่ได้
                alert("เข้าสู่ระบบไม่สำเร็จ: " + error.message);
            });
    }
    </script>
</body>
</html>
